name: Keep-Alive 24/7 (Render Backend)

on:
  schedule:
    # Runs every 12 minutes (Render free tier sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime

jobs:
  keep-alive:
    name: Ping Render Health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Backend Health Endpoint
        run: |
          echo "Pinging Tourni Render Backend..."
          # Use || echo "000" to prevent curl exit code 28 (timeout) from crashing the bash script
          HTTP_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 60 https://leagueflow-v80x.onrender.com/health || echo "000")
          echo "Backend HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::warning ::Backend returned HTTP $HTTP_STATUS (likely waking up from sleep). Retrying in 10s with 90s timeout..."
            sleep 10
            RETRY_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 90 https://leagueflow-v80x.onrender.com/health || echo "000")
            echo "Retry HTTP Status: $RETRY_STATUS"
            if [ "$RETRY_STATUS" = "200" ]; then
              echo "Backend is alive and healthy! 🚀"
            else
              echo "::warning ::Backend ping returned $RETRY_STATUS. It may still be booting up or suspended on Render."
            fi
          else
            echo "Backend is alive and healthy! 🚀"
          fi

      - name: Ping Frontend Vercel
        run: |
          echo "Pinging Tourni Vercel Frontend..."
          FRONTEND_STATUS=$(curl -s -L -o /dev/null -w "%{http_code}" --max-time 20 https://tourni-th.vercel.app || echo "000")
          echo "Frontend HTTP Status: $FRONTEND_STATUS"
